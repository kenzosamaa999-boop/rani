
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Makanan</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
    <div class="logo">🍔 KASIR MAKANAN</div>
    <p>Sistem Manajemen Data Makanan</p>
</header>

<main>
    <section class="statistik">
        <div class="stat-card">
            <span>Total Makanan</span>
            <h2 id="totalMakanan">0</h2>
        </div>
        <div class="stat-card">
            <span>Total Nilai Harga</span>
            <h2 id="totalHarga">Rp0</h2>
        </div>
    </section>

    <section class="panel">
        <h2 id="judulForm">Tambah Makanan</h2>

        <form id="formMakanan">
            <input type="hidden" id="id_makanan">

            <label>Nama Makanan</label>
            <input
                type="text"
                id="nama_makanan"
                placeholder="Masukkan nama makanan"
                required
            >

            <label>Harga Makanan (Rp)</label>
            <input
                type="number"
                id="harga"
                placeholder="Masukkan harga"
                min="0"
                step="0.01"
                required
            >

            <div class="form-buttons">
                <button type="submit" id="btnSimpan">
                    + Tambah Makanan
                </button>

                <button
                    type="button"
                    id="btnBatal"
                    class="btn-batal"
                    hidden
                    onclick="resetForm()"
                >
                    Batal
                </button>
            </div>
        </form>
    </section>

    <section class="panel">
        <div class="table-header">
            <div>
                <h2>Data Makanan</h2>
                <p>Daftar makanan yang tersimpan di database</p>
            </div>

            <button onclick="ambilData()" class="btn-refresh">
                ↻ Refresh
            </button>
        </div>

        <input
            type="search"
            id="pencarian"
            placeholder="Cari nama makanan..."
        >

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Makanan</th>
                        <th>Nama Makanan</th>
                        <th>Harga</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="daftarMakanan">
                    <tr>
                        <td colspan="4">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    Sistem Kasir Makanan © 2026
</footer>

<script src="script.js"></script>
</body>
</html>
